<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Claude Code with GitHub Actions on AWS Bedrock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303031"/>
      <stop offset="1" stop-color="#1e1e1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFDB70"/>
      <stop offset="1" stop-color="#FFBB5C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- three stages: GitHub Actions -> AWS Bedrock -> Claude Code -->
    <g fill="#2b2b2c" stroke="#3d3d3e" stroke-width="2">
      <rect x="28" y="110" width="216" height="150" rx="20"/>
      <rect x="292" y="110" width="216" height="150" rx="20"/>
      <rect x="556" y="110" width="216" height="150" rx="20" stroke="url(#gold)" stroke-width="4"/>
    </g>
    <g font-size="34" font-weight="600" fill="#FAFAFA">
      <text x="136" y="178">GitHub</text>
      <text x="136" y="220">Actions</text>
      <text x="400" y="178">AWS</text>
      <text x="400" y="220">Bedrock</text>
      <text x="664" y="178" fill="url(#gold)">Claude</text>
      <text x="664" y="220" fill="url(#gold)">Code</text>
    </g>
    <g stroke="#FFDB70" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 185 H286 M272 171 L286 185 L272 199"/>
      <path d="M514 185 H550 M536 171 L550 185 L536 199"/>
    </g>
    <g font-size="22" fill="#D6D6D6" fill-opacity="0.8">
      <text x="268" y="300">OIDC</text>
      <text x="532" y="300">no stored keys</text>
    </g>
    <text x="400" y="380" font-size="28" fill="#D6D6D6" fill-opacity="0.8">@claude on pull requests and issues</text>
  </g>
</svg>
