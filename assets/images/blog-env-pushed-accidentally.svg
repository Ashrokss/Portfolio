<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Terminal showing the steps to recover from a committed .env file">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303031"/>
      <stop offset="1" stop-color="#1e1e1f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="40" y="45" width="720" height="360" rx="20" fill="#161617" stroke="#3d3d3e" stroke-width="2"/>
  <path d="M40 65 a20 20 0 0 1 20 -20 h680 a20 20 0 0 1 20 20 v32 h-720 z" fill="#2b2b2c"/>
  <circle cx="76" cy="72" r="8" fill="#d1584d"/>
  <circle cx="104" cy="72" r="8" fill="#FFDB70"/>
  <circle cx="132" cy="72" r="8" fill="#5fb56b"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="27">
    <text x="72" y="160" fill="#d1584d">! .env leaked: rotate every secret</text>
    <text x="72" y="215" fill="#FFDB70">$ <tspan fill="#FAFAFA">git rm --cached .env</tspan></text>
    <text x="72" y="265" fill="#FFDB70">$ <tspan fill="#FAFAFA">echo ".env" &gt;&gt; .gitignore</tspan></text>
    <text x="72" y="315" fill="#FFDB70">$ <tspan fill="#FAFAFA">git commit -m "Stop tracking .env"</tspan></text>
    <text x="72" y="365" fill="#FFDB70">$ <tspan fill="#FAFAFA">git push</tspan><tspan fill="#FFDB70">▌</tspan></text>
  </g>
</svg>
